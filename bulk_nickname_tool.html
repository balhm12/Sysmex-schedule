<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀원 영문명 일괄 적용</title>
<style>
  body{font-family:'Malgun Gothic',sans-serif;background:#F2F6FC;margin:0;padding:24px;color:#1E2B45;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:20px;color:#003087;margin-bottom:4px;}
  .sub{color:#5C6675;font-size:13px;margin-bottom:20px;}
  .card{background:white;border:1px solid #D7E0EE;border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 10px;border-bottom:1px solid #EAF1FB;text-align:left;}
  th{background:#F2F6FC;color:#003087;}
  .team-title{font-weight:700;color:#0072CE;margin:14px 0 6px;font-size:14px;}
  .status-new{color:#0072CE;font-weight:700;}
  .status-same{color:#5C6675;}
  .status-nochange{color:#5C6675;}
  .status-unmatched{color:#C0453B;font-weight:700;}
  button{background:#003087;color:white;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  button:disabled{background:#B7C4D9;cursor:not-allowed;}
  #log{white-space:pre-wrap;font-family:monospace;font-size:12.5px;background:#0B1C33;color:#9FE6A0;padding:14px;border-radius:8px;margin-top:12px;max-height:260px;overflow:auto;display:none;}
  .warn{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>팀원 영문명 일괄 적용</h1>
  <div class="sub">FS East · FS West · FSS 팀 영문명을 한 번에 반영합니다. 이름·직급·순서는 건드리지 않고 영문명만 채웁니다.</div>
  <div class="warn">⚠ 적용 전 아래 미리보기를 확인해주세요. "적용" 버튼을 눌러야 실제로 저장됩니다.</div>

  <div class="card">
    <div id="preview">불러오는 중...</div>
    <div style="margin-top:16px;">
      <button id="applyBtn" disabled>미리보기 불러오는 중...</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
const FIREBASE_URL = "https://sysmex-system-schedule-default-rtdb.firebaseio.com";
const FIREBASE_API_KEY = "AIzaSyANZEYTXeDy3M1TV_rIG9Rp3m1TJk3MEy8";

// 적용할 영문명 매핑 (스크린샷 + 요청 내용 기준)
const NICKNAME_MAP = {
  east: {
    '김병우':'Gray', '유용선':'Felix', '이준호':'Juno', '손지원':'Sean', '김규민':'Min',
    '서윤걸':'Daniel', '김세진':'Martin', '윤병지':'Blue', '박재우':'Woody', '서재훈':'Jose', '김회창':'Asher',
  },
  west: {
    '허석':'Huymori', '채대석':'David', '전우상':'Ryan', '김보석':'Jade', '이인구':'Nine',
    '김태윤':'Tyler', '김동찬':'Charlie', '안성무':'Armin', '현준':'Teo', '이경민':'Kody', '백원욱':'Owen', '심구':'Frank',
  },
  fss: {
    '손흥민':'Jun', '김용한':'Max', '신관호':'Bob',
  },
};
const TEAM_LABEL = { west:'FS West', east:'FS East', fss:'FSS' };

let _idToken = null;
let rosterCache = {}; // team -> array (서버 원본, 이름/직급/순서 보존용)

function log(msg){
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function initAuth(){
  const res = await fetch(
    'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_API_KEY,
    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({returnSecureToken:true}) }
  );
  if(!res.ok){
    const body = await res.text();
    throw new Error('로그인 실패 (HTTP ' + res.status + '): ' + body);
  }
  const data = await res.json();
  if(!data.idToken) throw new Error('로그인 응답에 토큰이 없습니다: ' + JSON.stringify(data));
  _idToken = data.idToken;
}

async function fbFetch(path, opts){
  opts = opts || {};
  const url = FIREBASE_URL + path + (path.includes('?') ? '&' : '?') + 'auth=' + _idToken;
  const res = await fetch(url, opts);
  if(!res.ok) throw new Error(path + ' 요청 실패: HTTP ' + res.status);
  return res;
}

async function loadPreview(){
  await initAuth();
  log('✓ 인증 완료 (토큰 길이 ' + (_idToken ? _idToken.length : 0) + ')');

  const res = await fbFetch('/work-schedule/teamRoster.json');
  const rawText = await res.text();
  log('✓ 서버 응답 수신 (HTTP ' + res.status + ', ' + rawText.length + '자)');
  let roster;
  try{ roster = JSON.parse(rawText) || {}; }
  catch(e){ throw new Error('응답이 JSON이 아닙니다: ' + rawText.slice(0,200)); }
  const teamKeys = Object.keys(roster);
  log('✓ 불러온 팀 키: [' + teamKeys.join(', ') + ']' + (teamKeys.length ? '' : '  ← 비어 있음. 규칙/경로 문제일 수 있습니다'));

  let html = '';
  let totalNew = 0;
  const applyPlan = {}; // team -> 새 배열 (전체 필드 보존 + nickname만 갱신)

  Object.keys(NICKNAME_MAP).forEach(team=>{
    const current = roster[team] || [];
    rosterCache[team] = current;
    const map = NICKNAME_MAP[team];
    const matchedNames = new Set();

    const rows = current.map(m=>{
      const newNick = map[m.name];
      let status, statusClass;
      if(newNick === undefined){
        status = '(매핑 없음 — 변경 안 함)'; statusClass = 'status-same';
      } else if(m.nickname === newNick){
        status = '변경 없음(이미 동일)'; statusClass = 'status-nochange';
      } else {
        status = (m.nickname ? '"' + m.nickname + '" → ' : '') + '"' + newNick + '"로 설정';
        statusClass = 'status-new';
        totalNew++;
      }
      if(newNick !== undefined) matchedNames.add(m.name);
      return { name:m.name, role:m.role, current:m.nickname||'(없음)', newNick: newNick!==undefined?newNick:m.nickname, status, statusClass };
    });

    // 매핑에는 있는데 현재 명단에서 이름이 안 잡힌 경우 (오타/인사이동 등) — 경고용으로 표시
    const unmatched = Object.keys(map).filter(n=> !matchedNames.has(n));

    applyPlan[team] = current.map(m=> ({ name:m.name, role:m.role||'', nickname: (map[m.name]!==undefined ? map[m.name] : (m.nickname||'')) }));

    html += '<div class="team-title">' + TEAM_LABEL[team] + ' (' + current.length + '명)</div>';
    html += '<table><tr><th>이름</th><th>직급</th><th>기존 영문명</th><th>결과</th></tr>';
    rows.forEach(r=>{
      html += '<tr><td>'+r.name+'</td><td>'+(r.role||'')+'</td><td>'+r.current+'</td><td class="'+r.statusClass+'">'+r.status+'</td></tr>';
    });
    html += '</table>';
    if(unmatched.length){
      html += '<div class="warn" style="margin-top:8px;">⚠ 현재 명단에서 이름을 찾지 못함(오타이거나 이미 명단에서 빠짐): ' + unmatched.join(', ') + '</div>';
    }
  });

  document.getElementById('preview').innerHTML = html;
  const btn = document.getElementById('applyBtn');
  btn.textContent = '적용 (' + totalNew + '건 변경)';
  btn.disabled = totalNew === 0;
  btn.onclick = ()=> applyAll(applyPlan);
  if(totalNew === 0) log('변경할 내용이 없습니다 (이미 전부 반영됐거나 매핑된 이름을 찾지 못함)');
}

async function applyAll(applyPlan){
  document.getElementById('applyBtn').disabled = true;
  document.getElementById('applyBtn').textContent = '적용 중...';
  for(const team of Object.keys(applyPlan)){
    try{
      // 팀 하나(teamRoster/{team})만 타겟 저장 — 다른 팀·다른 데이터는 건드리지 않음
      await fbFetch('/work-schedule/teamRoster/' + team + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(applyPlan[team]),
      });
      log('✓ ' + TEAM_LABEL[team] + ' 저장 완료 (' + applyPlan[team].length + '명)');
    }catch(e){
      log('✗ ' + TEAM_LABEL[team] + ' 저장 실패: ' + e.message);
    }
  }
  document.getElementById('applyBtn').textContent = '적용 완료';
  log('\n모두 완료됐습니다. 근무일정표를 새로고침해서 확인해주세요.');
}

loadPreview().catch(e=>{
  document.getElementById('preview').innerHTML = '<div class="warn">불러오기 실패: ' + e.message + '</div>';
  log('✗ ' + e.message);
});
</script>
</body>
</html>
