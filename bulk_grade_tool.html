<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀원 직급 일괄 갱신</title>
<style>
  body{font-family:'Malgun Gothic',sans-serif;background:#F2F6FC;margin:0;padding:24px;color:#1E2B45;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:20px;color:#003087;margin-bottom:4px;}
  .sub{color:#5C6675;font-size:13px;margin-bottom:20px;}
  .card{background:white;border:1px solid #D7E0EE;border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 10px;border-bottom:1px solid #EAF1FB;text-align:left;}
  th{background:#F2F6FC;color:#003087;}
  .team-title{font-weight:700;color:#0072CE;margin:14px 0 6px;font-size:14px;}
  .up{color:#0072CE;font-weight:700;}
  .same{color:#5C6675;}
  .miss{color:#C0453B;font-weight:700;}
  button{background:#003087;color:white;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  button:disabled{background:#B7C4D9;cursor:not-allowed;}
  #log{white-space:pre-wrap;font-family:monospace;font-size:12.5px;background:#0B1C33;color:#9FE6A0;padding:14px;border-radius:8px;margin-top:12px;max-height:280px;overflow:auto;display:none;}
  .warn{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>팀원 직급 일괄 갱신</h1>
  <div class="sub">FSG 로스터(2026-10-01 진급 반영) 기준으로 근무일정표의 직급을 맞춥니다. 이름·순서·영문명은 건드리지 않습니다.</div>
  <div class="warn">⚠ 적용 전 아래 미리보기를 확인해주세요. "적용" 버튼을 눌러야 실제로 저장됩니다.</div>

  <div class="card">
    <div id="preview">불러오는 중...</div>
    <div style="margin-top:16px;"><button id="applyBtn" disabled>미리보기 불러오는 중...</button></div>
    <div id="log"></div>
  </div>
</div>

<script>
const FIREBASE_URL = "https://sysmex-system-schedule-default-rtdb.firebaseio.com";
const FIREBASE_API_KEY = "AIzaSyANZEYTXeDy3M1TV_rIG9Rp3m1TJk3MEy8";

// FSG 로스터 기준 직급 (fsg-roster 스킬 roster.csv, 2026-10-01 진급 반영)
const GRADE_MAP = {
  west: { '허석':'팀장','채대석':'T3','전우상':'T3','김보석':'T3','이인구':'T2','김태윤':'T2',
          '현준':'T1','김동찬':'T1','안성무':'T1','이경민':'T1','백원욱':'T1','심구':'T1' },
  east: { '김병우':'팀장','유용선':'T4','이준호':'T2','손지원':'T2','김규민':'T2','김세진':'T2',
          '서윤걸':'T2','윤병지':'T1','박재우':'T1','서재훈':'T1','김회창':'T1' },
  central: { '정근하':'팀장','이만식':'T3','문유진':'T3','이건석':'T3','김재모':'T2','한승호':'T2',
             '유재혁':'T1','강태은':'T1','손혜린':'T1','이건우':'T1' },
  south: { '성기홍':'팀장','문창수':'T3','박석영':'T4','박동민':'T3','이승직':'T3','이준민':'T2',
           '이도협':'T2','김태현':'T2','윤진성':'T2','조수호':'T1','김성학':'T1' },
  fss: { '손흥민':'팀장','김용한':'T4','신관호':'T3' },
};
const TEAM_LABEL = { west:'FS West', east:'FS East', central:'FS Central', south:'FS South', fss:'FSS' };

let _idToken = null;

function log(msg){
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

async function initAuth(){
  const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_API_KEY,
    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({returnSecureToken:true}) });
  if(!res.ok) throw new Error('로그인 실패 (HTTP ' + res.status + '): ' + await res.text());
  const data = await res.json();
  if(!data.idToken) throw new Error('로그인 응답에 토큰이 없습니다');
  _idToken = data.idToken;
}

async function fbFetch(path, opts){
  const url = FIREBASE_URL + path + (path.includes('?') ? '&' : '?') + 'auth=' + _idToken;
  const res = await fetch(url, opts || {});
  if(!res.ok) throw new Error(path + ' 요청 실패: HTTP ' + res.status);
  return res;
}

async function loadPreview(){
  await initAuth();
  log('✓ 인증 완료 (토큰 길이 ' + _idToken.length + ')');

  const res = await fbFetch('/work-schedule/teamRoster.json');
  const raw = await res.text();
  log('· teamRoster 응답: HTTP ' + res.status + ', ' + raw.length + '자');
  let roster = {};
  try{ roster = JSON.parse(raw) || {}; }catch(e){ throw new Error('응답이 JSON이 아닙니다: ' + raw.slice(0,200)); }
  const have = Object.keys(roster);
  log('· 서버에 명단이 있는 팀: [' + have.join(', ') + ']');
  const absent = Object.keys(GRADE_MAP).filter(t => !roster[t] || !roster[t].length);
  if(absent.length){
    log('· 서버에 명단이 없는 팀(건너뜀): ' + absent.map(t=>TEAM_LABEL[t]).join(', '));
  }

  let html = '', total = 0;
  const plan = {};

  Object.keys(GRADE_MAP).forEach(team=>{
    const current = roster[team];
    if(!current || !current.length){
      html += '<div class="team-title">' + TEAM_LABEL[team] + '</div>' +
              '<div class="warn">서버에 이 팀 명단이 저장되어 있지 않아 건너뜁니다. ' +
              '(코드 기본값이 쓰이므로 <b>work-schedule.html</b> 업로드만으로 반영됩니다)</div>';
      return;
    }
    const map = GRADE_MAP[team];
    const rows = current.map(m=>{
      const want = map[m.name];
      let status, cls;
      if(want === undefined){ status = '(로스터에 없음 — 변경 안 함)'; cls = 'miss'; }
      else if((m.role||'') === want){ status = '변경 없음'; cls = 'same'; }
      else { status = (m.role||'(없음)') + ' → ' + want; cls = 'up'; total++; }
      return { name:m.name, cur:m.role||'(없음)', nick:m.nickname||'', status, cls };
    });
    // 이름·순서·영문명은 그대로, 직급만 교체
    plan[team] = current.map(m=>({
      name: m.name,
      role: (map[m.name] !== undefined ? map[m.name] : (m.role||'')),
      nickname: m.nickname || '',
    }));

    html += '<div class="team-title">' + TEAM_LABEL[team] + ' (' + current.length + '명)</div>';
    html += '<table><tr><th>이름</th><th>영문명</th><th>현재 직급</th><th>결과</th></tr>';
    rows.forEach(r=>{
      html += '<tr><td>'+r.name+'</td><td>'+r.nick+'</td><td>'+r.cur+'</td><td class="'+r.cls+'">'+r.status+'</td></tr>';
    });
    html += '</table>';

    const unmatched = Object.keys(map).filter(n => !current.some(m=>m.name===n));
    if(unmatched.length){
      html += '<div class="warn">⚠ 서버 명단에서 이름을 찾지 못함: ' + unmatched.join(', ') + '</div>';
    }
  });

  document.getElementById('preview').innerHTML = html;
  const btn = document.getElementById('applyBtn');
  btn.textContent = '적용 (' + total + '건 변경)';
  btn.disabled = total === 0;
  btn.onclick = ()=> applyAll(plan);
  if(total === 0) log('변경할 직급이 없습니다 (이미 전부 반영됨)');
}

async function applyAll(plan){
  const btn = document.getElementById('applyBtn');
  btn.disabled = true; btn.textContent = '적용 중...';
  for(const team of Object.keys(plan)){
    try{
      if(!Array.isArray(plan[team]) || plan[team].length === 0){
        log('✗ ' + TEAM_LABEL[team] + ' 건너뜀 — 명단이 비어 있어 저장하지 않습니다');
        continue;
      }
      await fbFetch('/work-schedule/teamRoster/' + team + '.json', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(plan[team]),
      });
      log('✓ ' + TEAM_LABEL[team] + ' 저장 완료 (' + plan[team].length + '명)');
    }catch(e){
      log('✗ ' + TEAM_LABEL[team] + ' 저장 실패: ' + e.message);
    }
  }
  btn.textContent = '적용 완료';
  log('\n모두 완료됐습니다. 근무일정표를 새로고침해서 확인해주세요.');
}

loadPreview().catch(e=>{
  document.getElementById('preview').innerHTML = '<div class="warn">불러오기 실패: ' + e.message + '</div>';
  log('✗ ' + e.message);
});
</script>
</body>
</html>
