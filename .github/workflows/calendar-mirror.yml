# 근무일정표 → Google 캘린더 「FSG 근무일정 거울」 (읽기 전용 거울)
#
# 매일 05:30(한국 시간)에 근무일정표(Firebase work-schedule)의 오늘부터 7일치를 읽어
# 기본 근무가 아닌 상태(내근·회의·휴가·당직 등)를 전용 캘린더에 종일 일정으로 복사한다.
# 아침 브리핑(Google Calendar 를 읽는 예약 작업)이 이 캘린더를 본다.
#
# 필요한 비밀값 (GitHub → Settings → Secrets and variables → Actions) — 설정 절차는
# scripts/calendar-mirror/README.md
#   FIREBASE_API_KEY            근무일정표 화면의 FIREBASE_API_KEY 와 같은 값
#   FIREBASE_DB_URL             https://<프로젝트>-default-rtdb.firebaseio.com
#   GOOGLE_SERVICE_ACCOUNT_KEY  서비스 계정 키(JSON) 파일의 내용 전체
#   MIRROR_CALENDAR_ID          「FSG 근무일정 거울」 캘린더의 ID
#
# · Firebase 에는 쓰지 않는다(읽기만). 팀별로 7일 토막만 받는다(하루 약 0.1MB 이하).
# · 예약 실행은 하루 한 번뿐이다. 주기를 늘리거나 기간을 넓히지 않는다(다운로드가 요금을 좌우한다).
# · 실패하면 이 워크플로가 실패로 끝나 GitHub 알림이 간다.
# · 로그에는 건수만 남는다(이름·상태·비밀값을 찍지 않는다 — 공개 저장소의 로그는 누구나 본다).
#
# 2026-11-25: 매일 실행은 Apps Script 판(apps-script-calendar/mirror.gs, 「FSG 근무일정 캘린더」 프로젝트의 시간 트리거)으로 옮겼다.
# GitHub 예약 실행은 4~8시간 밀렸고(05:30 예약이 09:30~13:50에 돎) 시크릿이 없어 매일 실패 메일만 보냈다.
# 그래서 예약(schedule)은 끄고 손으로 돌리는 것만 남긴다. 다시 쓰려면 아래 schedule 두 줄을 되살리고 시크릿 4개를 넣는다.
name: 근무일정 거울 캘린더 동기화
on:
  # schedule:
  #   - cron: "30 20 * * *" # UTC 20:30 = 한국 시간 다음 날 05:30
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: calendar-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 근무일정표 → 거울 캘린더
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MIRROR_CALENDAR_ID: ${{ secrets.MIRROR_CALENDAR_ID }}
        run: node scripts/calendar-mirror/mirror.js
