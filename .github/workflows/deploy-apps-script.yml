# apps-script/survey_analysis.gs 가 바뀌어 main 에 올라오면
# 만족도 시트(고객만족도조사_구글서베이_Trial)에 붙은 Apps Script 에 코드를 올린다.
#
# 필요한 비밀값 (GitHub → Settings → Secrets and variables → Actions):
#   VOC_CLASPRC_JSON  PC 에서 `npx @google/clasp@2.4.2 login` 후 생긴 ~/.clasprc.json 의 내용 전체
#   VOC_SCRIPT_ID     Apps Script 편집기 → 프로젝트 설정 → 스크립트 ID
#   VOC_DEPLOYMENT_ID (선택) 대시보드 JSON 웹앱 배포 ID — 있으면 같은 URL 로 새 버전까지 배포
#
# 비밀값이 하나라도 없으면 올리지 않고 안내만 남긴다(설정 전에도 PR 검사는 돈다).
#
# ■ 덮어쓰기 사고 방지 (2026-11-12)
#   clasp 는 프로젝트의 코드 파일을 통째로 바꾼다. 실제로 이 방식 이전에
#   편집기에 직접 붙여넣다가 기능이 조용히 사라진 적이 있다(Drive 폴더 읽기).
#   그래서 올리기 전에 **편집기의 현재 코드**를 받아, 마지막으로 올린 코드
#   (apps-script/.deployed.sha256)와 같은지 확인한다. 다르면 = 누군가 편집기에서
#   직접 고쳤다는 뜻이므로 **올리지 않고 멈춘다**. 편집기 코드는 아티팩트로 올려
#   사람이 비교할 수 있게 한다.
#   일부러 덮어쓰려면 workflow_dispatch 의 force 를 yes 로 실행한다.
name: Deploy Apps Script (만족도)
on:
  push:
    branches: [main]
    paths: [apps-script/survey_analysis.gs]
  workflow_dispatch:
    inputs:
      force:
        description: "편집기 코드가 달라도 덮어쓴다 (yes 로 입력)"
        required: false
        default: "no"
      pull_version:
        description: "배포된 특정 버전의 코드만 받아 아티팩트로 올린다 (버전 번호, 예: 2). 넣으면 올리기는 하지 않는다"
        required: false
        default: ""
      redeploy:
        description: "웹 앱 배포를 지금 Head 로 갱신한다. list = 배포 목록만 보기, 배포 ID = 그 배포를 새 버전으로 갱신(주소 유지). 넣으면 코드 올리기는 하지 않는다"
        required: false
        default: ""
concurrency: deploy-voc-apps-script
permissions:
  contents: write
jobs:
  gas:
    runs-on: ubuntu-latest
    if: github.repository == 'balhm12/Sysmex-schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 문법 확인
        run: node -e "new Function(require('fs').readFileSync('apps-script/survey_analysis.gs','utf8'));console.log('syntax ok')"

      - name: 비밀값 확인
        id: check
        env:
          CLASPRC: ${{ secrets.VOC_CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.VOC_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC" ] || [ -z "$SCRIPT_ID" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::VOC_CLASPRC_JSON · VOC_SCRIPT_ID 가 아직 없습니다 — 문법 확인만 하고 올리지 않았습니다."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # 웹 앱 배포 갱신. `clasp deploy -i <배포 ID>` 는 그 배포를 **지금 Head 로** 새 버전으로
      # 바꾸고 주소(.../exec)는 그대로 둔다(= 편집기 「배포 관리 › 수정 › 새 버전」과 같은 일).
      # 이 프로젝트는 한 배포가 doGet(공개 대시보드)과 doPost(PC 업로드 입구)를 함께 쓰므로,
      # 엉뚱한 배포를 건드리지 않도록 먼저 `redeploy: list` 로 목록을 보고 ID 를 넣는다.
      # Head 가 불완전한 상태에서 하면 기능이 사라지므로, 올리기가 성공한 뒤에만 한다.
      - name: 웹 앱 배포 갱신
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.redeploy != ''
        env:
          CLASPRC: ${{ secrets.VOC_CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.VOC_SCRIPT_ID }}
          WANT: ${{ github.event.inputs.redeploy }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          npm i -g @google/clasp@2.4.2 >/dev/null
          mkdir -p gasdep && cd gasdep
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          echo "### 배포 목록 (갱신 전)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          clasp deployments | tee deployments.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$WANT" = "list" ]; then
            echo "::notice::배포 목록만 확인했습니다 — 아무것도 바꾸지 않았습니다."
            rm -f ~/.clasprc.json; exit 0
          fi
          if ! grep -q -- "$WANT" deployments.txt; then
            echo "::error::배포 ID '$WANT' 가 이 프로젝트의 배포 목록에 없습니다. redeploy: list 로 먼저 확인하세요."
            rm -f ~/.clasprc.json; exit 1
          fi
          clasp deploy -i "$WANT" -d "repo ${GITHUB_SHA::7}"
          echo "### 갱신 뒤" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          clasp deployments >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.clasprc.json

      # 웹 앱은 배포 시점에 얼린 코드로 돈다. 편집기(Head)에서 코드가 바뀌어도
      # 배포된 버전은 그대로이므로, 그 버전 안에만 남아 있는 코드를 꺼내 볼 수 있다.
      # (2026-11-12: doPost·CRM 업로드 입구가 버전 2 에만 있는 것을 확인)
      - name: 배포된 버전 코드 받기
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version != '' && github.event.inputs.redeploy == ''
        env:
          CLASPRC: ${{ secrets.VOC_CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.VOC_SCRIPT_ID }}
          VER: ${{ github.event.inputs.pull_version }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          npm i -g @google/clasp@2.4.2 >/dev/null
          mkdir -p gasver && cd gasver
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull --versionNumber "$VER"
          echo "--- 버전 $VER 의 파일 ---"; ls -la
          mkdir -p ../version_out
          cp -a . ../version_out/ 2>/dev/null || :
          rm -f ../version_out/.clasp.json ~/.clasprc.json
          cd ..
          echo "### 버전 $VER 에만 있는 것" >> "$GITHUB_STEP_SUMMARY"
          for f in doPost uploadCore_ crmLoadFromFolder_ loadCrmTable_ crmConvert_ UPLOAD_TOKEN; do
            n=$(grep -rho "$f" version_out 2>/dev/null | wc -l)
            m=$(grep -o "$f" apps-script/survey_analysis.gs 2>/dev/null | wc -l)
            echo "- \`$f\` — 버전 $VER: ${n}회 / 지금 저장소: ${m}회" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 버전 코드 보관
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version != '' && github.event.inputs.redeploy == ''
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-version-${{ github.event.inputs.pull_version }}
          path: version_out
          retention-days: 14

      - name: 버전만 받고 끝낸다
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version != '' && github.event.inputs.redeploy == ''
        run: |
          echo "::notice::버전 ${{ github.event.inputs.pull_version }} 코드를 아티팩트로 올렸습니다 — 올리기는 하지 않았습니다."
          exit 0

      - name: 편집기 코드 받기
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version == '' && github.event.inputs.redeploy == ''
        id: pull
        env:
          CLASPRC: ${{ secrets.VOC_CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.VOC_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          npm i -g @google/clasp@2.4.2 >/dev/null
          mkdir -p gas && cd gas
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull                    # 프로젝트 설정(appsscript.json)도 여기서 받아 그대로 쓴다
          echo "--- 편집기 파일 ---"; ls
          cat $(ls *.js *.gs 2>/dev/null) > ../live_now.txt 2>/dev/null || : > ../live_now.txt
          cd ..
          echo "live=$(bash apps-script/normalize.sh live_now.txt | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "want=$(cat apps-script/.deployed.sha256 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: 편집기 코드 보관 (비교용)
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version == '' && github.event.inputs.redeploy == ''
        uses: actions/upload-artifact@v4
        with:
          name: editor-code-before-deploy
          path: live_now.txt
          retention-days: 14

      - name: 편집기가 직접 수정됐는지 확인
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version == '' && github.event.inputs.redeploy == ''
        run: |
          LIVE='${{ steps.pull.outputs.live }}'
          WANT='${{ steps.pull.outputs.want }}'
          FORCE='${{ github.event.inputs.force }}'
          if [ -z "$WANT" ]; then
            echo "::notice::기준 해시가 없습니다(첫 배포) — 그대로 진행합니다."
            exit 0
          fi
          if [ "$LIVE" = "$WANT" ]; then
            echo "편집기 코드 = 마지막으로 올린 코드. 안전하게 덮어쓸 수 있습니다."
            exit 0
          fi
          if [ "$FORCE" = "yes" ]; then
            echo "::warning::편집기 코드가 다르지만 force=yes 라 그대로 덮어씁니다."
            exit 0
          fi
          echo "::error::편집기 코드가 마지막으로 올린 코드와 다릅니다 — 누군가 편집기에서 직접 고쳤을 수 있습니다."
          echo "::error::기준 $WANT / 지금 $LIVE"
          echo "::error::이 실행의 아티팩트 editor-code-before-deploy 를 받아 apps-script/survey_analysis.gs 와 비교한 뒤,"
          echo "::error::편집기 쪽 변경을 저장소 파일에 반영하거나, 버려도 되면 force=yes 로 다시 실행하세요."
          exit 1

      - name: 올리기
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version == '' && github.event.inputs.redeploy == ''
        env:
          DEPLOYMENT_ID: ${{ secrets.VOC_DEPLOYMENT_ID }}
        run: |
          cd gas
          # 코드 파일은 survey_analysis.gs 하나로 통일한다
          find . -maxdepth 1 \( -name '*.js' -o -name '*.gs' \) -delete
          cp ../apps-script/survey_analysis.gs Code.js
          clasp push -f
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" -d "${GITHUB_SHA::7}"
          fi
          rm -f ~/.clasprc.json

      - name: 올린 코드를 기준 해시로 기록
        if: steps.check.outputs.ready == 'yes' && github.event.inputs.pull_version == '' && github.event.inputs.redeploy == ''
        run: |
          NEW=$(bash apps-script/normalize.sh apps-script/survey_analysis.gs | sha256sum | cut -d' ' -f1)
          if [ "$NEW" = "$(cat apps-script/.deployed.sha256 | tr -d '[:space:]')" ]; then
            echo "기준 해시 그대로 — 커밋할 것 없음"; exit 0
          fi
          echo "$NEW" > apps-script/.deployed.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/.deployed.sha256
          git commit -m "배포한 Apps Script 기준 해시 갱신 (${GITHUB_SHA::7})"
          git push
