name: HERO X 게임 배포 (GitHub Pages)

# hero-x 브랜치에 게임 소스가 올라오면 빌드해서 main 브랜치의 game/ 폴더에 넣습니다.
# 이 저장소의 GitHub Pages 는 main 브랜치(루트)를 그대로 보여주므로,
# 결과는 https://balhm12.github.io/Sysmex-schedule/game/ 에서 열립니다.
# main 의 다른 파일(일정표 등)은 건드리지 않고 game/ 폴더만 바꿉니다.
on:
  push:
    branches: [hero-x]
    paths:
      - "hero-x/**"
      - ".github/workflows/deploy-hero-x.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-hero-x
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hero-x/package-lock.json

      - name: 의존성 설치
        working-directory: hero-x
        run: npm ci

      - name: 타입 검사 + 단위 테스트 + 빌드
        working-directory: hero-x
        run: npm run check

      - name: main 브랜치 game/ 폴더로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: hero-x/dist
          destination_dir: game
          keep_files: true
          commit_message: "HERO X 게임 배포 (game/ 폴더 갱신)"
