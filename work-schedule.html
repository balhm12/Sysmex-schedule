function openMemberOrderPanel(){
  _panelDismissable = false; _panelAllowsSync = false; // 입력용 (팀원 추가 입력칸이 있음)
  const panel = document.getElementById('panel');

  function renderList(){
    const tk = currentTeam === 'all' ? TEAM_ORDER[0] : currentTeam;
    const members = TEAMS[tk].members;
    const teamLabel = TEAMS[tk].label;
    panel.innerHTML =
      '<button class="close" onclick="closePanel()">✕</button>' +
      '<h3>팀원 관리</h3>' +
      '<div class="sub">' + escapeHtml(teamLabel) + (currentTeam==='all' ? ' (팀별로 각각 관리해요 · 상단 팀 탭에서 다른 팀 선택 후 다시 열어주세요)' : '') + '</div>' +
      '<div class="form-row form-grid2" style="margin-bottom:6px;">' +
        '<div><input type="text" id="newMemberName" placeholder="이름" autocomplete="off"></div>' +
        '<div><input type="text" id="newMemberRole" placeholder="직급 (예: T1)" autocomplete="off"></div>' +
      '</div>' +
      '<div class="form-row" style="margin-bottom:10px;">' +
        '<input type="text" id="newMemberNickname" placeholder="영문명 (선택, 예: Jun)" autocomplete="off">' +
      '</div>' +
      '<button class="btn-save" id="addMemberBtn" style="width:100%;margin-bottom:14px;">+ 팀원 추가</button>' +
      '<div id="orderList"></div>';
    const listEl = panel.querySelector('#orderList');
    members.forEach((m, i)=>{
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--paper);';
      row.innerHTML =
        '<span style="flex:1;font-size:13px;font-weight:700;color:var(--ink);">' + escapeHtml(m.name) + ' <span style="font-size:11px;font-weight:600;color:var(--ink-soft);">' + escapeHtml(m.role) + '</span></span>' +
        '<input data-act="nick" type="text" value="' + escapeHtml(m.nickname||'') + '" placeholder="영문명" autocomplete="off" style="width:88px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;">' +
        '<button data-dir="up" style="width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:white;cursor:pointer;font-size:12px;" ' + (i===0?'disabled':'') + '>▲</button>' +
        '<button data-dir="down" style="width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:white;cursor:pointer;font-size:12px;" ' + (i===members.length-1?'disabled':'') + '>▼</button>' +
        '<button data-act="del" style="width:28px;height:28px;border-radius:7px;border:1px solid var(--c-holiday, #D93B3B);background:white;color:#D93B3B;cursor:pointer;font-size:12px;">✕</button>';
      const nickInput = row.querySelector('[data-act="nick"]');
      nickInput.onchange = ()=> updateNickname(tk, i, nickInput.value);
      row.querySelector('[data-dir="up"]').onclick = ()=> moveMember(tk, i, -1);
      row.querySelector('[data-dir="down"]').onclick = ()=> moveMember(tk, i, 1);
      row.querySelector('[data-act="del"]').onclick = ()=> removeMember(tk, i);
      listEl.appendChild(row);
    });
    panel.querySelector('#addMemberBtn').onclick = ()=>{
      const nameInput = panel.querySelector('#newMemberName');
      const roleInput = panel.querySelector('#newMemberRole');
      const nickInput2 = panel.querySelector('#newMemberNickname');
      addMember(tk, nameInput.value, roleInput.value, nickInput2.value);
    };
  }

  async function persistAndRefresh(tk){
    rebuildAllTeam();
    renderList();
    renderTeamTabs(); // 팀 탭의 인원수 배지도 즉시 갱신
    render();
    await saveTeamRoster(tk);
  }

  async function moveMember(tk, idx, dir){
    const members = TEAMS[tk].members;
    const j = idx + dir;
    if(j < 0 || j >= members.length) return;
    const tmp = members[idx]; members[idx] = members[j]; members[j] = tmp;
    await persistAndRefresh(tk);
  }

  async function addMember(tk, name, role, nickname){
    name = (name||'').trim();
    role = (role||'').trim();
    nickname = (nickname||'').trim();
    if(!name){ showToast('⚠ 이름을 입력해주세요'); return; }
    if(/[.#$\/\[\]]/.test(name)){ showToast('⚠ 이름에 . # $ / [ ] 문자는 사용할 수 없습니다 (저장이 실패할 수 있어요)'); return; }
    if(TEAMS[tk].members.some(m=> m.name === name)){ showToast('⚠ 이미 같은 이름의 팀원이 있습니다'); return; }
    TEAMS[tk].members.push({ name, role, nickname });
    await persistAndRefresh(tk);
    showToast(name + ' 님을 추가했습니다');
  }

  async function updateNickname(tk, idx, nickname){
    const m = TEAMS[tk].members[idx];
    if(!m) return;
    m.nickname = (nickname||'').trim();
    rebuildAllTeam();
    await saveTeamRoster(tk);
    showToast(m.name + ' 님의 영문명을 저장했습니다');
  }

  async function removeMember(tk, idx){
    const m = TEAMS[tk].members[idx];
    if(!m) return;
    if(!confirm('"' + m.name + '" 팀원을 명단에서 삭제할까요?\n(이미 입력된 근무 기록은 남아있지만 명단에는 더 이상 표시되지 않습니다)')) return;
    TEAMS[tk].members.splice(idx, 1);
    await persistAndRefresh(tk);
    showToast(m.name + ' 님을 삭제했습니다');
  }

  renderList();
  document.getElementById('overlay').classList.add('show');
}

function clearCellHighlight(){
  document.querySelectorAll('.hl-cross, .hl-sel, .hl-name, .hl-date').forEach(el=>{
    el.classList.remove('hl-cross','hl-sel','hl-name','hl-date');
  });
}
function highlightCell(date, name){
  clearCellHighlight();
  // 월간: 같은 이름 행 + 같은 날짜 칸 / 주간: 같은 날짜 행 + 같은 이름 칸
  document.querySelectorAll('td[data-date][data-name]').forEach(td=>{
    const sameDate = td.dataset.date === date;
    const sameName = td.dataset.name === name;
    if(sameDate && sameName){ td.classList.add('hl-sel'); }
    else if(sameDate || sameName){ td.classList.add('hl-cross'); }
  });
  // 이름은 이제 사용자가 자유롭게 입력하므로(따옴표 등 포함 가능), CSS 선택자 문자열에
  // 직접 끼워넣지 않고 항상 안전한 정적 선택자 + JS 비교로 처리합니다.
  document.querySelectorAll('tr[data-name]').forEach(tr=>{
    if(tr.dataset.name === name) tr.querySelectorAll('td.namecell').forEach(td=> td.classList.add('hl-name'));
  });
  document.querySelectorAll('tr[data-date="'+date+'"] td.datecell').forEach(td=> td.classList.add('hl-date'));
}

function openEditor(team, date, name){
  _panelDismissable = false; _panelAllowsSync = false; // 입력용
  highlightCell(date, name);
  const panel = document.getElementById('panel');
  const entry = Object.assign(blankEntry(), getEntry(team,date,name));
  const parts = date.split('-').map(Number);
  const y=parts[0], m=parts[1], d=parts[2];
  const wk = weekdayKr(y,m,d);
  const weekend = isWeekendDate(date);
  const isOffDay = weekend || !!HOLIDAYS_KR[date];
  const member = TEAMS[team].members.find(mm=>mm.name===name);

  // 슬롯마다 "누가 · 언제" 넣었는지 라벨 옆에 작게 붙입니다.
  // 오전1은 A가, 오후1은 B가 넣는 식으로 한 칸 안에서도 등록자가 갈리기 때문입니다.
  function slotLabel(text, slot){
    const m = slotMeta(entry, slot) || ((entry[slot] && (entry.by || entry.at)) ? {by:entry.by, at:entry.at} : null);
    const tag = m
      ? '<span class="slot-by" title="' + escapeHtml((m.by || '(이름 없음)') + (m.at ? ' · ' + m.at : '')) + '">' +
          escapeHtml(m.by || '(이름 없음)') + (m.at ? ' · ' + escapeHtml(shortStamp(m.at)) : '') + '</span>'
      : '';
    return '<label>' + text + tag + '</label>';
  }
  function slotInput(id, val){
    return '<div class="combo' + (val ? ' has-val' : '') + '" id="wrap-' + id + '">' +
      '<input type="text" id="' + id + '" class="combo-input" value="' + escapeHtml(val) + '" placeholder="" autocomplete="off">' +
      '<button type="button" class="clr-btn" tabindex="-1" title="이 칸 비우기" aria-label="이 칸 비우기">&times;</button>' +
      '<button type="button" class="combo-toggle" tabindex="-1">▾</button>' +
      '<div class="combo-list"></div>' +
    '</div>';
  }
  // 드롭다운이 없는 입력칸(업무내역)용 — 같은 ✕를 붙여 줍니다.
  function clearableInput(id, placeholder, val, style){
    return '<div class="clr-wrap' + (val ? ' has-val' : '') + '" id="wrap-' + id + '">' +
      '<input type="text" id="' + id + '" placeholder="' + escapeHtml(placeholder) + '"' +
        (style ? ' style="' + style + '"' : '') + ' value="' + escapeHtml(val) + '">' +
      '<button type="button" class="clr-btn" tabindex="-1" title="이 칸 비우기" aria-label="이 칸 비우기">&times;</button>' +
    '</div>';
  }

  // 등록자 기본값: 내 이름 > 마지막에 쓴 이름 > 이 칸에 남아 있던 이름
  const byDefault = defaultEditorName() || entry.by || '';
  function editorOptions(){
    const ms = TEAMS[team].members || [];
    const names = ms.map(m=>m.name);
    // 그 팀 명단에 없는 이름(다른 팀·타 부서·신규 입사자)도 끼워 넣어 그대로 고를 수 있게
    const extra = (byDefault && names.indexOf(byDefault) === -1)
      ? '<option value="' + escapeHtml(byDefault) + '" selected>' + escapeHtml(byDefault) + '</option>'
      : '';
    return '<option value="">선택 안 함</option>' + extra + ms.map(mm=>
      '<option value="' + escapeHtml(mm.name) + '"' + (mm.name===byDefault?' selected':'') + '>' +
      escapeHtml(mm.name) + (mm.role ? ' (' + escapeHtml(mm.role) + ')' : '') + '</option>').join('');
  }

  const teamNightList = nightStatusListFor(team);
  const teamWeekendList = weekendStatusListFor(team);
  const nightParsed = splitDetail(entry.night, teamNightList);
  const weekendParsed = splitDetail(entry.weekend, teamWeekendList);
  // 목록에 없는 옛 값(팀 편성이 바뀌기 전 데이터 등)은 선택지로 끼워 넣어 그대로 보존합니다.
  // 예전에는 이런 값이 '-'로 보였고, 저장을 누르면 아무 말 없이 지워졌습니다.
  const nightLegacy = (entry.night && !nightParsed.key) ? entry.night : '';
  const weekendLegacy = (entry.weekend && !weekendParsed.key) ? entry.weekend : '';
  if(nightLegacy) nightParsed.key = nightLegacy;
  if(weekendLegacy) weekendParsed.key = weekendLegacy;
  const legacyOpt = raw => ({key:raw, label:raw + ' (기존 값)'});
  const nightList = nightLegacy ? teamNightList.concat([legacyOpt(nightLegacy)]) : teamNightList;
  const weekendList = weekendLegacy ? teamWeekendList.concat([legacyOpt(weekendLegacy)]) : teamWeekendList;
  const nightOptions = nightList.filter(s=> !s.key || s.weekdayOnly || s.key === nightParsed.key);
  // 이 칸에 이미 들어 있는 내용을 사람이 읽을 수 있게 한 줄로 — 덮어쓰기/비우기 확인창에 씁니다.
  function occupiedSummary(e){
    if(!e) return '';
    const out = [];
    SLOT_KEYS.forEach(k=>{ if(e[k] && e[k] !== 'OFF') out.push(SLOT_LABELS[k] + ' ' + e[k]); });
    if(e.night) out.push('야간 ' + e.night);
    if(e.weekend) out.push('주말/휴일 ' + e.weekend);
    return out.join(', ');
  }

  panel.innerHTML =
    '<button class="close" onclick="closePanel()">✕</button>' +
    '<h3>' + escapeHtml(name) + ' <span style="font-size:12px;color:var(--ink-soft);font-weight:600;">' + escapeHtml(member?member.role:'') + '</span></h3>' +
    '<div class="sub">' + y + '년 ' + m + '월 ' + d + '일 (' + wk + ') · ' + TEAMS[team].label +
      (entry.at || entry.by ? '<span class="entry-stamp" title="이 칸을 마지막으로 저장한 사람">✍ 마지막 저장 ' + escapeHtml(entry.by || '(이름 없음)') + (entry.at ? ' · ' + escapeHtml(shortStamp(entry.at)) : '') + '</span>' : '') +
    '</div>' +

    '<div id="ampmRows" style="' + (isOffDay?'display:none;':'') + '">' +
      '<div class="form-row form-grid2">' +
        '<div>' + slotLabel('오전1','am1') + slotInput('f-am1', entry.am1) + '</div>' +
        '<div>' + slotLabel('오전2','am2') + slotInput('f-am2', entry.am2) + '</div>' +
      '</div>' +
      '<div class="form-row form-grid2">' +
        '<div>' + slotLabel('오후1','pm1') + slotInput('f-pm1', entry.pm1) + '</div>' +
        '<div>' + slotLabel('오후2','pm2') + slotInput('f-pm2', entry.pm2) + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="form-row" id="nightRow" style="' + (isOffDay?'display:none;':'') + '">' +
      slotLabel('야간','night') +
      '<select id="f-night">' + nightOptions.map(s=>'<option value="' + escapeHtml(s.key) + '" ' + (nightParsed.key===s.key?'selected':'') + '>' + escapeHtml(s.label) + '</option>').join('') + '</select>' +
      clearableInput('f-night-detail', '야간 업무내역', nightParsed.detail, 'margin-top:6px;') +
    '</div>' +

    '<div class="form-row" id="weekendRow" style="' + (isOffDay?'':'display:none;') + '">' +
      slotLabel('주말/휴일 구분','weekend') + '<select id="f-weekend">' + weekendList.map(s=>'<option value="' + escapeHtml(s.key) + '" ' + (weekendParsed.key===s.key?'selected':'') + '>' + escapeHtml(s.label) + '</option>').join('') + '</select>' +
      clearableInput('f-weekend-detail', '주말/휴일 업무내역', weekendParsed.detail, 'margin-top:6px;') +
    '</div>' +

    // 등록자 — '지금 고치는 사람'이 먼저 들어갑니다.
    // 예전에는 기존 일정의 등록자가 그대로 들어 있어서, 그 상태로 저장하면 내가 바꾼
    // 칸까지 그 사람이 넣은 것으로 기록됐습니다. 그래서 일정을 고치려면 먼저 비우고
    // 다시 넣어야 했습니다. 이제는 지우지 않고 바로 고쳐도 바꾼 사람 이름이 남습니다.
    '<div class="form-row">' +
      '<label>등록자</label>' +
      '<select id="f-by">' + editorOptions() + '</select>' +
      (entry.by && entry.by !== byDefault
        ? '<div class="by-hint">이 칸은 <b>' + escapeHtml(entry.by) + '</b>님이 마지막으로 저장했습니다. ' +
          '지금 <b>바꾸는 칸</b>에만 위 이름이 기록되고, 손대지 않은 칸은 원래 등록자가 그대로 남습니다.</div>'
        : '') +
    '</div>' +

    // 위 '특이사항'은 그 칸(야간·주말)에 붙는 짧은 비고입니다. 기관·장비까지 적어
    // 기관·장비까지 적어 기록으로 남길 내용은 아래 버튼으로 등록합니다.
    '<button type="button" class="note-link" id="f-note">📌 이 날짜 특이사항 등록 (기술 · 고객 · 일반)</button>' +

    '<div class="form-actions">' +
      '<button class="btn-clear" id="f-clear">비우기</button>' +
      '<button class="btn-cancel" id="f-cancel">취소</button>' +
      '<button class="btn-save" id="f-save">저장</button>' +
    '</div>';

  const slotIds = ['f-am1','f-am2','f-pm1','f-pm2'];

  function applyCascade(triggerId, val){
    const st = HALF_MAP[val];
    if(!st || !st.fillGroup) return;
    let targets;
    if(st.fillGroup === 'all') targets = slotIds;
    else if(st.fillGroup === 'am') targets = ['f-am1','f-am2'];
    else targets = ['f-pm1','f-pm2'];
    targets.forEach(oid=>{ panel.querySelector('#'+oid).value = val; });
  }

  function renderComboList(listEl, filterText){
    const q = (filterText||'').trim().toLowerCase();
    let statusItems = HALF_STATUS.filter(s=>s.key);
    if(!isOffDay) statusItems = statusItems.filter(s=> s.key !== '당직'); // 당직은 주말·공휴일에만 선택 가능
    const instItems = q ? INSTITUTION_LIST.filter(n=> n.toLowerCase().includes(q)).slice(0,8) : [];
    let html = '';
    const matchedStatus = q ? statusItems.filter(s=> s.label.toLowerCase().includes(q) || s.key.toLowerCase().includes(q)) : statusItems;
    matchedStatus.forEach(s=>{
      html += '<div class="combo-item" data-val="' + s.key + '"><span class="ci-dot" style="background:' + s.color + '"></span>' + s.label + '</div>';
    });
    if(instItems.length){
      instItems.forEach(n=>{
        html += '<div class="combo-item" data-val="' + n.replace(/"/g,'&quot;') + '"><span class="ci-dot" style="background:#C6CEDD"></span>' + n + '</div>';
      });
    }
    listEl.innerHTML = html;
    // 예전에는 결과가 없을 때 "일치하는 항목 없음" 한 줄을 띄웠는데, 병원명을 직접 입력하는
    // 중에는 대부분 0건이라 그 한 줄이 계속 떠서 입력칸을 가렸다(특히 모바일).
    // 이제는 보여줄 항목이 있을 때만 목록을 띄운다.
    return matchedStatus.length + instItems.length;
  }
  // 목록을 열되, 보여줄 항목이 없으면 닫아둔다
  function showComboList(input, list, filterText){
    const count = renderComboList(list, filterText);
    if(count === 0){ list.classList.remove('show'); return; }
    positionCombo(input, list);
    list.classList.add('show');
  }

  function closeAllCombos(){
    panel.querySelectorAll('.combo-list.show').forEach(l=>l.classList.remove('show'));
  }
  // 드롭다운이 패널 안(overflow:auto)에 붙어있으면 패널 하단 근처 입력창(특히 오후1·오후2)에서
  // 목록 뒷부분(교육·회의 등)이 화면 밖으로 잘려 안 보이는 문제가 있었습니다.
  // 화면 좌표 기준으로 직접 위치를 계산해서 항상 전체 목록이 보이게 합니다.
  // 목록이 입력칸 아래 흐름에 놓이므로 위치 계산은 필요 없다.
  // 다만 목록이 화면 밖으로 밀려 안 보일 수 있으니, 열린 뒤 보이도록 스크롤만 맞춘다.
  function positionCombo(input, list){
    setTimeout(()=>{
      if(!list.classList.contains('show')) return;
      const r = list.getBoundingClientRect();
      const vv = window.visualViewport;
      const viewBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
      if(r.bottom > viewBottom - 8){
        list.scrollIntoView({ block:'nearest', behavior:'smooth' });
      }
    }, 0);
  }
  // 목록이 패널 안에서 함께 스크롤되므로, 예전처럼 스크롤 시 닫을 필요가 없다
  // (떠 있는 방식일 때만 위치가 어긋나서 닫아야 했다).

  // ── 칸 비우기 ✕ ──
  // 내용이 있을 때만 보이게 하고, 누르면 그 칸만 즉시 비웁니다(다른 칸·저장값은 그대로).
  // 바로 저장하지는 않습니다 — [저장]을 눌러야 반영되므로 잘못 눌러도 [취소]로 되돌릴 수 있습니다.
  function syncClear(wrap){
    if(!wrap) return;
    const inp = wrap.querySelector('input');
    wrap.classList.toggle('has-val', !!(inp && inp.value));
  }
  function bindClear(wrapId, onCleared){
    const wrap = panel.querySelector('#'+wrapId);
    if(!wrap) return;
    const inp = wrap.querySelector('input');
    const btn = wrap.querySelector('.clr-btn');
    if(!inp || !btn) return;
    inp.addEventListener('input', ()=> syncClear(wrap));
    inp.addEventListener('change', ()=> syncClear(wrap));
    // mousedown으로 처리해야 입력칸의 blur보다 먼저 동작합니다(모바일 키보드 깜빡임 방지).
    btn.addEventListener('mousedown', (e)=>{ e.preventDefault(); e.stopPropagation(); });
    btn.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      inp.value = '';
      syncClear(wrap);
      if(onCleared) onCleared();
    });
    syncClear(wrap);
  }
  bindClear('wrap-f-night-detail');
  bindClear('wrap-f-weekend-detail');

  slotIds.forEach(id=>{
    const wrap = panel.querySelector('#wrap-'+id);
    const input = wrap.querySelector('.combo-input');
    const toggle = wrap.querySelector('.combo-toggle');
    const list = wrap.querySelector('.combo-list');
    bindClear('wrap-'+id, ()=>{ list.classList.remove('show'); });

    toggle.onclick = (e)=>{
      e.stopPropagation();
      const willOpen = !list.classList.contains('show');
      closeAllCombos();
      if(willOpen) showComboList(input, list, '');
    };
    input.addEventListener('focus', ()=>{
      closeAllCombos();
      showComboList(input, list, '');
    });
    input.addEventListener('input', function(){
      showComboList(input, list, this.value);
      applyCascade(id, this.value.trim());
      slotIds.forEach(sid=> syncClear(panel.querySelector('#wrap-'+sid))); // 자동 채움된 칸까지 같이 갱신
    });
    list.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.combo-item');
      if(!item || item.dataset.val === undefined) return;
      e.preventDefault();
      const val = item.dataset.val;
      const st = HALF_MAP[val];
      const isInstitution = !st && INSTITUTION_LIST.includes(val);
      if((st && st.hasDetail) || isInstitution){
        input.value = val + ': ';
        list.classList.remove('show');
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
      } else {
        input.value = val;
        list.classList.remove('show');
        applyCascade(id, val);
      }
      slotIds.forEach(sid=> syncClear(panel.querySelector('#wrap-'+sid)));
    });
  });
  panel.addEventListener('click', (e)=>{
    if(!e.target.closest('.combo')) closeAllCombos();
  });

  const nightSel = panel.querySelector('#f-night');
  if(nightSel){
    nightSel.addEventListener('change', function(){
      const usesDefaultNightSet = !NIGHT_STATUS_BY_TEAM[team];
      if(usesDefaultNightSet && this.value && this.value !== 'OFF' && this.value !== '잔업'){
        slotIds.forEach(oid=>{ panel.querySelector('#'+oid).value = 'OFF'; });
      }
    });
  }

  panel.querySelector('#f-note').onclick = ()=>{
    closePanel();
    openNotePanel({team: team, date: date, author: name});
  };
  panel.querySelector('#f-cancel').onclick = closePanel;
  panel.querySelector('#f-clear').onclick = async ()=>{
    // 되돌릴 수 없는 삭제라서 한 번 확인합니다 (칸 하나만 지우려면 각 칸의 ✕를 쓰면 됩니다).
    const had = occupiedSummary(entry);
    if(had && !confirm(
      name + '님 ' + date + ' 일정을 모두 지웁니다.\n\n현재 내용: ' + had +
      '\n\n되돌릴 수 없습니다. 지울까요?\n(한 칸만 지우려면 그 칸의 ✕를 누르세요)'
    )) return;
    setEntry(team, date, name, blankEntry());
    closePanel(); render();
    await saveEntriesToServer([{team, date, name, entry: blankEntry()}]);
  };
  panel.querySelector('#f-save').onclick = async ()=>{
    function cleanSlot(v){
      v = (v||'').trim();
      const mm = v.match(/^(회의|교육):\s*$/);
      return mm ? mm[1] : v;
    }
    const editorName = panel.querySelector('#f-by').value.trim();
    setLastEditor(editorName);
    const stampedAt = nowStamp();
    // 바뀐 슬롯만 등록자를 새로 찍습니다. 손대지 않은 슬롯은 원래 등록자를 그대로 둬야
    // "오전1은 A가, 오후1은 B가"가 유지됩니다.
    function stampSlots(before, after){
      const meta = Object.assign({}, (before && before.meta) || {});
      ENTRY_SLOTS.forEach(k=>{
        const was = (before && before[k]) || '', now = after[k] || '';
        if(!now) delete meta[k];                                   // 비워진 슬롯은 기록도 지움
        else if(was !== now) meta[k] = { by: editorName, at: stampedAt };
        else if(!meta[k] && (before && (before.by || before.at))) meta[k] = { by: before.by || '', at: before.at || '' };
      });
      after.meta = meta;
      return after;
    }
    // 화면에서 감춰진 칸은 "비우라는 뜻"이 아닙니다. 주말·공휴일에는 오전1~오후2가,
    // 평일에는 주말/휴일 칸이 숨겨지는데, 예전에는 저장할 때 숨겨진 칸을 빈 값으로
    // 덮어써서 — 토요일 칸을 한 번 저장하기만 해도 거기 있던 휴가·근무 내용이
    // 통째로 사라졌습니다. 숨겨진 입력칸은 열었을 때의 값을 그대로 들고 있으므로
    // 그냥 읽어서 다시 저장합니다.
    const updated = {
      night: combineDetail(panel.querySelector('#f-night').value, panel.querySelector('#f-night-detail').value),
      weekend: combineDetail(panel.querySelector('#f-weekend').value, panel.querySelector('#f-weekend-detail').value),
      am1: cleanSlot(panel.querySelector('#f-am1').value),
      am2: cleanSlot(panel.querySelector('#f-am2').value),
      pm1: cleanSlot(panel.querySelector('#f-pm1').value),
      pm2: cleanSlot(panel.querySelector('#f-pm2').value),
      by: editorName,
      at: stampedAt,
    };
    stampSlots(entry, updated);
    setEntry(team, date, name, updated);
    const toSave = [{team, date, name, entry: updated}];
    const nightSt = nightStatusOf(updated.night, team);
    const nightLabel = nightSt ? nightSt.label : '';
    const prevNightSt = nightStatusOf(entry.night, team);
    const prevNightLabel = prevNightSt ? prevNightSt.label : '';
    // 연쇄 입력(다음 근무일 자동 채움)은 야간 값이 "새로 바뀐 순간"에만 한 번 돕니다.
    // 예전에는 현재 값만 보고 판단해서, 같은 칸을 다시 저장할 때마다(등록자 이름만
    // 고쳐도) 다시 돌면서 다음 근무일에 적어 둔 휴가·일정을 OFF로 덮어썼습니다.
    const nightChanged = nightLabel !== prevNightLabel;
    let cascadeDays = [];
    if(nightChanged && nightLabel === '석/야'){
      const d1 = nextWorkday(date);
      cascadeDays = [d1, nextWorkday(d1)];   // 다음 근무일 = 석간, 그다음 = OFF
    }else if(nightChanged && nightLabel === '석간'){
      cascadeDays = [nextWorkday(date)];     // 다음 근무일 = OFF
    }
    if(cascadeDays.length){
      // 자동으로 채울 날짜에 이미 다른 일정이 있으면, 말없이 덮어쓰지 않고 물어봅니다.
      const conflicts = cascadeDays
        .map(dy=> ({dy, what: occupiedSummary(getEntry(team, dy, name))}))
        .filter(x=> x.what);
      if(conflicts.length && !confirm(
        nightLabel + '을 선택하셨으니 다음 근무일을 자동으로 채웁니다.\n' +
        '그런데 아래 날짜에 이미 일정이 있습니다:\n\n' +
        conflicts.map(c=> '· ' + c.dy + ' — ' + c.what).join('\n') +
        '\n\n덮어쓸까요?\n[취소]를 누르면 ' + date + ' 칸만 저장하고 나머지는 그대로 둡니다.'
      )) cascadeDays = [];
    }
    cascadeDays.forEach((dy, i)=>{
      const prev = Object.assign({}, getEntry(team, dy, name));
      const e = Object.assign(blankEntry(), prev);
      e.by = editorName; e.at = stampedAt;
      if(nightLabel === '석/야' && i === 0) e.night = '석간';
      e.am1 = e.am2 = e.pm1 = e.pm2 = 'OFF';
      stampSlots(prev, e);
      setEntry(team, dy, name, e);
      toSave.push({team, date:dy, name, entry:e});
    });
    closePanel(); render();
    await saveEntriesToServer(toSave);
  };

  document.getElementById('overlay').classList.add('show');
}
function closePanel(){
  document.getElementById('overlay').classList.remove('show');
  clearCellHighlight();
  // 창을 닫으면 그 창의 설정값은 반드시 되돌린다. 안 그러면 마지막에 열린 창의
  // 성격(바깥클릭 허용·자동갱신 허용)이 그대로 남아, 다음에 열리는 입력창에
  // 잘못 적용된다.
  _panelDismissable = false; _panelAllowsSync = false;
  // 입력 중이라 미뤄 둔 갱신이 있으면 지금 처리한다 (그냥 버리면 옛 데이터가 남는다).
  if(_syncPending){ _syncPending = false; scheduleRealtimeSync(); }
}
// 바깥(배경) 클릭으로 닫히는 동작은 패널 종류에 따라 다르게 한다.
// - 입력용(근무 입력, 팀원 관리): 실수로 바깥을 터치하면(특히 모바일) 입력 내용이
//   통째로 사라지므로 바깥 클릭으로는 닫히지 않고 ✕/취소 버튼으로만 닫는다.
// - 읽기용 패널이 새로 생기면 여는 함수에서 _panelDismissable = true 로 설정하면 된다.
let _panelDismissable = false;
// true면 이 패널이 열려 있어도 뒤에서 자동 갱신이 계속된다 (입력값이 없는 안내성 패널)
let _panelAllowsSync = false;
// 입력 중이라 갱신을 건너뛴 적이 있으면 true — 창을 닫는 순간 한 번 따라잡는다.
let _syncPending = false;
document.getElementById('overlay').onclick = (ev)=>{
  if(ev.target.id==='overlay' && _panelDismissable) closePanel();
};

// ============================================================
// Excel 내보내기 (현재 팀 · 현재 월) — 통계 시트 + 상세 시트
// ============================================================
async function exportExcel(){
  if(typeof ExcelJS === 'undefined'){ alert('엑셀 내보내기 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'); return; }
  const wb = new ExcelJS.Workbook();
  const team = TEAMS[currentTeam];
  const nDays = daysInMonth(viewYear, viewMonth);
  const statDefs = HALF_STATUS.filter(s=>s.key);
  const nightDefs = (function(){
    const seen = new Set(); const list = [];
    [NIGHT_STATUS_DEFAULT].concat(Object.values(NIGHT_STATUS_BY_TEAM)).forEach(l=>{
      l.filter(s=>s.key).forEach(s=>{ if(!seen.has(s.key)){ seen.add(s.key); list.push(s); } });
    });
    return list;
  })();
  const weekendDefs = (function(){
    const seen = new Set(); const list = [];
    [WEEKEND_STATUS_DEFAULT].concat(Object.values(WEEKEND_STATUS_BY_TEAM)).forEach(l=>{
      l.filter(s=>s.key).forEach(s=>{ if(!seen.has(s.key)){ seen.add(s.key); list.push(s); } });
    });
    return list;
  })();
  const NAVY = 'FF003087', WHITE = 'FFFFFFFF', LIGHTBLUE = 'FFE4F5FC', LINE = 'FFDFE6F2';

  function getMonthsWithData(tk){
    const months = new Set();
    const teamsToCheck = tk === 'all' ? TEAM_ORDER : [tk];
    teamsToCheck.forEach(t=>{
      Object.keys(scheduleData[t]||{}).forEach(dstr=>{ months.add(dstr.slice(0,7)); });
    });
    months.add(viewYear + '-' + String(viewMonth).padStart(2,'0'));
    return Array.from(months).sort();
  }

  function toArgb(hex){ return hex ? ('FF' + hex.replace('#','').toUpperCase()) : null; }

  // 값(am1~pm2/night/weekend) → 해당 상태 정의(HALF_STATUS/NIGHT_STATUS/WEEKEND_STATUS) 찾기 (색상 입히기용)
  function statusOf(val, tk){
    if(!val) return null;
    return matchStatus(val) || nightStatusOf(val, tk) || weekendStatusOf(val, tk);
  }
  function colorCell(cell, val, tk){
    const st = statusOf(val, tk);
    if(st && st.color){
      cell.font = {color:{argb: toArgb(st.color)}, bold:true};
      if(st.bg) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: toArgb(st.bg)}};
    }
  }

  // 팀·이름 기준 한 달 통계 집계 (오전/오후 상태 + 야간 + 주말/휴일구분 모두 포함)
  function computePersonStats(teamKey, name, y, mo){
    const nDaysM = daysInMonth(y, mo);
    const stats = {};
    statDefs.forEach(s=> stats['s_'+s.key]=0);
    nightDefs.forEach(s=> stats['n_'+s.key]=0);
    weekendDefs.forEach(s=> stats['w_'+s.key]=0);
    for(let d=1; d<=nDaysM; d++){
      const dstr = fmtDate(y, mo, d);
      const e = getEntry(teamKey, dstr, name);
      const foundToday = new Set();
      SLOT_KEYS.forEach(k=>{ const st = matchStatus(e[k]); if(st) foundToday.add(st.key); });
      foundToday.forEach(k=>{ if(stats['s_'+k]!==undefined) stats['s_'+k]++; });
      const nst = nightStatusOf(e.night, teamKey);
      if(nst && stats['n_'+nst.key]!==undefined) stats['n_'+nst.key]++;
      const wst = weekendStatusOf(e.weekend, teamKey);
      if(wst && stats['w_'+wst.key]!==undefined) stats['w_'+wst.key]++;
    }
    return stats;
  }
  function summarize(stats){
    return {
      workDays: stats['s_ON']||0,
      leaveDays: (stats['s_휴가']||0) + 0.5*(stats['s_오전휴가']||0) + 0.5*(stats['s_오후휴가']||0),
      duty: weekendDefs.filter(s=>s.key.indexOf('당직')!==-1).reduce((sum,s)=> sum + (stats['w_'+s.key]||0), 0),
      phone: stats['w_전화']||0,
      extra: stats['w_추가편성']||0,
      etc: stats['w_기타']||0,
      nightTotal: nightDefs.filter(s=>s.key!=='OFF').reduce((sum,s)=> sum + (stats['n_'+s.key]||0), 0),
      naegeun: stats['s_내근']||0,
      dp: stats['s_DP']||0,
      edu: stats['s_교육']||0,
      meet: stats['s_회의']||0,
    };
  }
  function styleHeaderRow(row){
    row.eachCell(c=>{ c.font = {bold:true, color:{argb:WHITE}}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:NAVY}}; c.alignment = {horizontal:'center', vertical:'middle'}; });
  }
  function borderAll(ws){
    ws.eachRow(row=> row.eachCell(c=>{
      c.border = {top:{style:'thin',color:{argb:LINE}}, bottom:{style:'thin',color:{argb:LINE}}, left:{style:'thin',color:{argb:LINE}}, right:{style:'thin',color:{argb:LINE}}};
    }));
  }

  const ym = viewYear + '-' + String(viewMonth).padStart(2,'0');
  const ymLabel = viewYear + '년 ' + viewMonth + '월';

  // ================= 개인별 요약 (전체 팀, 이번 달) =================

    });
  });
  summaryWs.addTable({

      {name:'근무일', filterButton:false}, {name:'휴가일수', filterButton:false}, {name:'당직', filterButton:false},
      {name:'전화대기', filterButton:false}, {name:'야간계', filterButton:false}, {name:'내근', filterButton:false},
      {name:'DP', filterButton:false}, {name:'교육', filterButton:false}, {name:'회의', filterButton:false},
    ],
    rows: summaryRows
  });
  [12,10,8,9,10,8,10,9,8,8,8,8].forEach((w,i)=> summaryWs.getColumn(i+1).width = w);
  styleHeaderRow(summaryWs.getRow(1));
  summaryWs.views = [{state:'frozen', ySplit:1}];
  summaryRows.forEach((r,i)=>{
    const row = summaryWs.getRow(i+2);

  });
  summaryWs.getCell('A' + (summaryRows.length+3)).value = ymLabel + ' 기준';
  summaryWs.getCell('A' + (summaryRows.length+3)).font = {italic:true, color:{argb:'FF5A6B8C'}, size:10};

  // ================= 팀별 비교 (이번 달) =================
  const teamWs = wb.addWorksheet('팀별 비교');
  const teamRows = [];
  const grandTotal = {workDays:0, leaveDays:0, duty:0, phone:0, extra:0, etc:0, nightTotal:0, naegeun:0, dp:0, edu:0, meet:0};
  let grandCount = 0;
  TEAM_ORDER.forEach(tk=>{
    const totals = {workDays:0, leaveDays:0, duty:0, phone:0, extra:0, etc:0, nightTotal:0, naegeun:0, dp:0, edu:0, meet:0};
    TEAMS[tk].members.forEach(m=>{
      const s = summarize(computePersonStats(tk, m.name, viewYear, viewMonth));
      Object.keys(totals).forEach(k=> totals[k]+=s[k]);
    });
    Object.keys(grandTotal).forEach(k=> grandTotal[k]+=totals[k]);

  });
  teamRows.push(['전체 합계', grandCount, grandTotal.workDays, grandTotal.leaveDays, grandTotal.duty, grandTotal.phone, grandTotal.extra, grandTotal.etc, grandTotal.nightTotal, grandTotal.naegeun, grandTotal.dp, grandTotal.edu, grandTotal.meet]);
  teamWs.addTable({
    name: 'TeamCompare', ref: 'A1', headerRow: true, totalsRow: false,
    style: {theme:'TableStyleMedium9', showRowStripes:true},
    columns: [
      {name:'팀', filterButton:false}, {name:'인원수', filterButton:false}, {name:'총근무일', filterButton:false},
      {name:'총휴가일수', filterButton:false}, {name:'총당직', filterButton:false}, {name:'총전화대기', filterButton:false},
      {name:'총추가편성', filterButton:false}, {name:'총기타', filterButton:false}, {name:'총야간계', filterButton:false},
      {name:'총내근', filterButton:false}, {name:'총DP', filterButton:false},

    ],
    rows: teamRows
  });
  [13,9,10,11,9,11,11,9,10,9,8,9,9].forEach((w,i)=> teamWs.getColumn(i+1).width = w);
  styleHeaderRow(teamWs.getRow(1));
  const teamTotalRowIdx = 1 + teamRows.length;
  teamWs.getRow(teamTotalRowIdx).eachCell(c=>{ c.font = {bold:true}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:LIGHTBLUE}}; });
  teamWs.views = [{state:'frozen', ySplit:1}];
  teamRows.forEach((r,i)=>{
    const row = teamWs.getRow(i+2);

  });

  // ================= 당직·야간 형평성 (팀별로 당직 많은 순 정렬 + 색상 스케일) =================
  const equityWs = wb.addWorksheet('형평성');

  equityWs.addTable({

    equityWs.addConditionalFormatting({

  equityWs.getCell('A' + (equityRows.length+3)).value = '색이 진할수록(빨강) 부담이 많고, 연할수록(초록) 적음 · ' + ymLabel + ' 기준';
  equityWs.getCell('A' + (equityRows.length+3)).font = {italic:true, color:{argb:'FF5A6B8C'}, size:10};

  // ---- 통계 시트 (월별, 현재 팀) ----
  const statsWs = wb.addWorksheet('통계');

  const statsRows = [];
  getMonthsWithData(currentTeam).forEach(monthYm=>{
    const parts = monthYm.split('-').map(Number);
    const y = parts[0], mo = parts[1];
    const monthTotals = {};
    statDefs.forEach(s=>monthTotals['s_'+s.key]=0);
    nightDefs.forEach(s=>monthTotals['n_'+s.key]=0);
    weekendDefs.forEach(s=>monthTotals['w_'+s.key]=0);

    team.members.forEach(m=>{
      const stats = computePersonStats(memberTeam(m), m.name, y, mo);
      Object.keys(stats).forEach(k=> monthTotals[k] = (monthTotals[k]||0) + stats[k]);
      statsRows.push([monthYm, sanitizeForExcel(m.name), sanitizeForExcel(m.role)]
        .concat(statDefs.map(s=>stats['s_'+s.key]||0))
        .concat(nightDefs.map(s=>stats['n_'+s.key]||0))
        .concat(weekendDefs.map(s=>stats['w_'+s.key]||0)));
    });
    statsRows.push([monthYm, '월 합계', '']
      .concat(statDefs.map(s=>monthTotals['s_'+s.key]||0))
      .concat(nightDefs.map(s=>monthTotals['n_'+s.key]||0))
      .concat(weekendDefs.map(s=>monthTotals['w_'+s.key]||0)));
  });
  statsWs.addTable({
    name: 'Stats', ref: 'A1', headerRow: true, totalsRow: false,
    style: {theme:'TableStyleMedium9', showRowStripes:true},
    columns: statsHeaders.map((h,i)=>({name:h, filterButton: i<3})),
    rows: statsRows
  });
  statsHeaders.forEach((h,i)=>{ statsWs.getColumn(i+1).width = i<3 ? 10 : 9; });
  styleHeaderRow(statsWs.getRow(1));
  statsWs.views = [{state:'frozen', ySplit:1}];
  statsRows.forEach((r,i)=>{
    if(r[1] === '월 합계'){
      const row = statsWs.getRow(i+2);

    }
  });

  // ---- 상세 시트 (일자별, 현재 팀 · 이번 달) — 상태별 색상 적용 ----
  const detailWs = wb.addWorksheet('상세');

      const mtk = memberTeam(m);
      const e = getEntry(mtk, dstr, m.name);
      detailRows.push([dstr, wk, sanitizeForExcel(m.name), sanitizeForExcel(m.role), sanitizeForExcel(e.am1||''), sanitizeForExcel(e.am2||''), sanitizeForExcel(e.pm1||''), sanitizeForExcel(e.pm2||''), sanitizeForExcel(e.night||''), sanitizeForExcel(e.weekend||'')]);
      detailTeams.push(mtk);
    });
  }
  detailWs.addTable({

    style: {theme:'TableStyleMedium9', showRowStripes:true},
    columns: [
      {name:'날짜', filterButton:true}, {name:'요일', filterButton:true}, {name:'이름', filterButton:true}, {name:'직급', filterButton:true},
      {name:'오전1', filterButton:false}, {name:'오전2', filterButton:false}, {name:'오후1', filterButton:false}, {name:'오후2', filterButton:false},
      {name:'야간', filterButton:false}, {name:'주말/휴일 구분', filterButton:false},
    ],
    rows: detailRows
  });
  [12,6,10,8,20,20,20,20,14,14].forEach((w,i)=> detailWs.getColumn(i+1).width = w);
  styleHeaderRow(detailWs.getRow(1));

  detailRows.forEach((r,i)=>{

  // ================= 야간·당직 로그 (전체 팀, 데이터 있는 모든 달) =================
  const logWs = wb.addWorksheet('야간·당직 로그');
  const allMonths = getMonthsWithData('all');

  function logSection(startRow, title, rows, headers){

      c.alignment = {horizontal:'center', vertical:'middle'};

  const nightRows = [];
  const dutyRows = [];

  allMonths.forEach(monthYm=>{

  // ---- 월별 집계 (인원수 · 횟수) ----
  function monthlyCount(rows){

      if(!byMonth[ym]) byMonth[ym] = {names:new Set(), count:0};
      byMonth[ym].names.add(r[3]);
      byMonth[ym].count++;
    });
    return byMonth;
  }
  const nightByMonth = monthlyCount(nightRows);

  [14,10,14,12,18,20,16].forEach((w,i)=> logWs.getColumn(i+1).width = w);

  detailWs.properties.tabColor = {argb:'FF6B7280'};

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = team.label + '_근무일정_' + viewYear + String(viewMonth).padStart(2,'0') + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Excel로 내보내기 완료 (개인별요약·팀별비교·형평성·야간당직로그·통계·상세)');
}

// ============================================================
// 이벤트 바인딩
// ============================================================
document.getElementById('prevBtn').onclick = ()=>{
  if(viewMode==='month'){ viewMonth--; if(viewMonth===0){viewMonth=12; viewYear--;} }
  else { weekAnchor = addDaysStr(weekAnchor, -7); }
  render();
};
document.getElementById('nextBtn').onclick = ()=>{
  if(viewMode==='month'){ viewMonth++; if(viewMonth===13){viewMonth=1; viewYear++;} }
  else { weekAnchor = addDaysStr(weekAnchor, 7); }
  render();
};
document.getElementById('todayBtn').onclick = ()=>{
  const t = new Date(); viewYear=t.getFullYear(); viewMonth=t.getMonth()+1; weekAnchor = todayISO(); render();
};
// 주간/월간은 각자 기준점(weekAnchor / viewYear·viewMonth)을 따로 갖고 있어서,
// 그대로 두면 주간으로 11월까지 넘긴 뒤 월간을 눌렀을 때 10월로 되돌아간다.
// 보기를 바꿀 때 서로의 기준점을 맞춰, 보고 있던 시점이 그대로 이어지게 한다.
// (달력뿐 아니라 그 아래 특이사항도 같은 기간을 따라가므로 더 중요하다)
document.getElementById('viewMonthBtn').onclick = ()=>{
  // 한 주가 두 달에 걸칠 수 있다. 그 주의 목요일이 속한 달을 그 주의 달로 본다(ISO 주차 기준).
  const thu = addDaysStr(getMonday(weekAnchor), 3).split('-').map(Number);
  viewYear = thu[0]; viewMonth = thu[1];
  viewMode='month';
  document.getElementById('viewMonthBtn').classList.add('active');
  document.getElementById('viewWeekBtn').classList.remove('active');
  render();
};
document.getElementById('viewWeekBtn').onclick = ()=>{
  // 보고 있던 달 안의 주로 들어간다 — 오늘이 그 달이면 이번 주, 아니면 그 달 1일이 든 주.
  const t = todayISO();
  const ym = viewYear + '-' + String(viewMonth).padStart(2,'0');
  if(t.slice(0,7) === ym){
    weekAnchor = t;
  } else {
    // 1일이 든 주는 목요일이 지난달일 수 있다(예: 11/1이 일요일이면 그 주는 10월 주차).
    // 그런 경우 한 주 뒤로 밀어, 되돌아와도 같은 달에 머물게 한다.
    let first = fmtDate(viewYear, viewMonth, 1);
    if(addDaysStr(getMonday(first), 3).slice(0,7) !== ym) first = addDaysStr(first, 7);
    weekAnchor = first;
  }
  viewMode='week';
  document.getElementById('viewWeekBtn').classList.add('active');
  document.getElementById('viewMonthBtn').classList.remove('active');
  render();
};
document.getElementById('meBtn').onclick = ()=> openMePanel(false);
document.getElementById('orderBtn').onclick = openMemberOrderPanel;
document.getElementById('dutyViewBtn').onclick = ()=>{
  dutyOnlyView = !dutyOnlyView;
  document.getElementById('dutyViewBtn').classList.toggle('active', dutyOnlyView);
  render();
};
document.getElementById('testConnBtn').onclick = testConnection;
document.getElementById('exportXlsxBtn').onclick = exportExcel;
document.getElementById('refreshBtn').onclick = async ()=>{
  await loadStorage(); render(); showToast('최신 일정을 불러왔습니다');
};
document.getElementById('noteAddBtn').onclick = ()=> openNotePanel({});
document.getElementById('guideBtn').onclick = openGuidePanel;
document.getElementById('noteXlsxBtn').onclick = exportNotesExcel;
// 지금 열려 있는 화면이 몇 번 버전인지 보여줍니다 (캐시 때문에 옛 화면을 보고 있는지 확인용).
function renderBuildStamp(){
  const el = document.getElementById('buildStamp');
  if(el) el.textContent = '화면 v' + BUILD_VERSION;
}
if(document.readyState === 'complete' || document.readyState === 'interactive') renderBuildStamp();
else window.addEventListener('DOMContentLoaded', renderBuildStamp);

// ============================================================
// 초기화
// ============================================================
(async function init(){
  // 내 이름이 기억돼 있으면 그 사람의 팀 탭으로 시작합니다 (명단 기준으로 팀을 다시 확인).
  const _me = getMe();
  if(_me){
    const myTeam = teamOfName(_me.name) || _me.team;
    if(myTeam && TEAMS[myTeam]) currentTeam = myTeam;
  }
  renderMeButton();
  renderTeamTabs();
  renderLegend();
  render();
  await _authReady; // 인증 사용 중이면 토큰이 준비될 때까지(최대 4초) 대기 후 최초 데이터 요청
  await loadStorage();
  // ── 1회성 마이그레이션 블록을 제거했습니다 (2026-10) ──
  // 여기에는 시드 삭제·시드 v3 반영·야간 키 이름 변경·주말 값 통일·명단 이전이
  // 들어 있었고, 전부 운영에서 이미 끝난 작업입니다. 게다가 loadStorage()가 값을
  // 반환하지 않아 실제로는 한 번도 실행되지 않는 죽은 코드였습니다.
  // 그대로 두면 서버의 '완료 표시'가 사라지는 날 되살아나 현재 데이터를 옛 시드로
  // 덮어쓸 수 있어서(전체 트리 덮어쓰기) 관련 코드까지 함께 지웠습니다.
  //
  // 새 마이그레이션이 필요하면 이 자리에 되살리지 말고, 바뀌는 칸만 건드리는
  // 개별 경로(saveEntryToServer 등)로 처리하세요. 전체 트리를 한 번에 쓰는 방식은
  // 이 프로젝트에서 이미 두 번 데이터 사고를 냈습니다.
  // 서버 명단을 받은 뒤 다시 한 번 — 명단이 늦게 와서 팀을 못 찾았을 수 있습니다.
  const _me2 = getMe();
  if(_me2){
    const myTeam2 = teamOfName(_me2.name);
    if(myTeam2 && TEAMS[myTeam2] && currentTeam !== myTeam2 && !_teamTouched){
      currentTeam = myTeam2; renderTeamTabs();
    }
  }
  render();
  // 이름을 한 번도 묻지 않았으면 여기서 한 번만 묻습니다. (닫으면 다시 묻지 않음)
  // 0.4초 사이에 사용자가 이미 다른 창(근무 입력 등)을 열었다면 그 창을 덮어쓰지 않습니다.
  if(!meAsked()) setTimeout(()=>{
    if(document.getElementById('overlay').classList.contains('show')) return;
    openMePanel(true);
  }, 400);
  startRealtimeSync();
  // 오래 열어둔 탭 대응.
  // 브라우저는 백그라운드 탭이나 절전 상태에서 타이머를 늦추거나 멈추고 실시간 연결도
  // 끊어버린다. 그래서 노트북을 덮었다 열거나 다른 탭을 보다 돌아오면 한동안 옛 데이터가
  // 그대로 보일 수 있다. 화면으로 돌아온 시점과 네트워크가 복구된 시점에 즉시 다시 불러온다.
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) scheduleRealtimeSync();
  });
  window.addEventListener('focus', scheduleRealtimeSync);
  window.addEventListener('online', scheduleRealtimeSync);
  setInterval(async ()=>{
    // 입력창이 열려 있으면 건너뛰되, 안내성 창(내 이름·사용법)은 막지 않는다.
    // 건너뛴 사실을 남겨 두어 창을 닫는 순간 따라잡게 한다.
    if(document.getElementById('overlay').classList.contains('show') && !_panelAllowsSync){
      _syncPending = true;
      return;
    }
    await loadStorage();
    render();
  }, 20000);
})();
</script>
